<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D74 Edits | Admin dashboard</title>
  <link rel="shortcut icon" type="image/x-icon" href="/logo.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/view/app.css">
  <link rel="stylesheet" href="/Admin/admin.css">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body class="dark admin-body" data-admin-page="dashboard" data-admin-title="Dashboard">
  <a class="admin-skip" href="#adminMain">Skip to content</a>
  <div id="adminRoot"></div>

  <template id="adminPage">
    <div class="admin-page-head">
      <div>
        <span class="admin-kicker">Live overview</span>
        <h2>Control room</h2>
        <p>Traffic, database quota, YouTube sync and administrator sessions in one place.</p>
      </div>
      <div class="admin-head-actions">
        <span class="admin-count" id="dashUpdated">Loading…</span>
        <button class="btn btn-ghost btn-sm" type="button" id="dashRefresh">
          <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon> Refresh
        </button>
      </div>
    </div>

    <div class="admin-stack" id="dashWarnings" aria-live="polite"></div>

    <div class="admin-stats admin-mt">
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="videocam-outline"></ion-icon> Videos</span>
        <div class="admin-stat-value" id="statVideos">—</div>
        <div class="admin-stat-meta"><span id="statDownloadable">—</span> downloadable</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="people-outline"></ion-icon> Accounts</span>
        <div class="admin-stat-value" id="statAccounts">—</div>
        <div class="admin-stat-meta">registered members</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="pulse-outline"></ion-icon> Requests / 24h</span>
        <div class="admin-stat-value" id="statRequests">—</div>
        <div class="admin-stat-meta"><span id="statRpm">—</span> per minute</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="person-add-outline"></ion-icon> Visitors / 24h</span>
        <div class="admin-stat-value" id="statVisitors">—</div>
        <div class="admin-stat-meta">hashed, no raw IP stored</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="flash-outline"></ion-icon> Cache hit rate</span>
        <div class="admin-stat-value" id="statCache">—</div>
        <div class="admin-stat-meta" id="statCacheDriver">—</div>
      </div>
      <div class="admin-stat" id="statErrorsCard">
        <span class="admin-stat-label"><ion-icon name="warning-outline"></ion-icon> Error rate</span>
        <div class="admin-stat-value" id="statErrors">—</div>
        <div class="admin-stat-meta"><span id="statAvgMs">—</span> avg response</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="shield-checkmark-outline"></ion-icon> Sessions</span>
        <div class="admin-stat-value" id="statSessions">—</div>
        <div class="admin-stat-meta">active administrators</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="radio-outline"></ion-icon> Live clients</span>
        <div class="admin-stat-value" id="statEvents">—</div>
        <div class="admin-stat-meta">SSE connections</div>
      </div>
    </div>

    <div class="admin-grid admin-grid-2 admin-mt">
      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">Requests and errors</span>
          <span class="admin-count" id="dashChartMeta">Last 24 hours</span>
        </div>
        <div class="admin-panel-body">
          <div class="admin-chart" id="dashChart"></div>
          <div class="admin-row admin-mt-sm">
            <span class="admin-badge admin-badge--accent">Requests</span>
            <span class="admin-badge admin-badge--error">Errors</span>
          </div>
        </div>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">Daily quota</span>
          <span class="admin-count">resets at midnight UTC</span>
        </div>
        <div class="admin-panel-body admin-stack">
          <div class="admin-progress">
            <div class="admin-progress-head">
              <span>Database requests</span>
              <strong id="quotaDbText">—</strong>
            </div>
            <div class="admin-progress-track"><div class="admin-progress-fill" id="quotaDbBar" style="width:0"></div></div>
            <span class="admin-hint" id="quotaDbMeta">—</span>
          </div>
          <div class="admin-progress">
            <div class="admin-progress-head">
              <span>YouTube API requests</span>
              <strong id="quotaYoutubeText">—</strong>
            </div>
            <div class="admin-progress-track"><div class="admin-progress-fill" id="quotaYoutubeBar" style="width:0"></div></div>
            <span class="admin-hint" id="quotaYoutubeMeta">—</span>
          </div>
          <div class="admin-alert admin-alert--info">
            <ion-icon name="information-circle-outline" aria-hidden="true"></ion-icon>
            <span>Reads are cached and coalesced. The database is only contacted when a cache entry is missing or stale.</span>
          </div>
        </div>
      </section>
    </div>

    <div class="admin-grid admin-grid-2 admin-mt">
      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">YouTube sync</span>
          <span class="admin-badge" id="syncStatus">—</span>
        </div>
        <div class="admin-panel-body admin-stack">
          <div id="syncChannels" class="admin-stack"></div>
          <div class="admin-actions">
            <button class="btn btn-primary btn-sm" type="button" id="syncNow">
              <ion-icon name="sync-outline" aria-hidden="true"></ion-icon> Sync now
            </button>
            <button class="btn btn-ghost btn-sm" type="button" id="syncDry">
              <ion-icon name="beaker-outline" aria-hidden="true"></ion-icon> Dry run
            </button>
          </div>
          <div class="admin-muted admin-mono" id="syncResult">No sync has run in this process yet.</div>
        </div>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">Recent audit events</span>
          <a class="btn btn-ghost btn-sm" href="/Admin/monitoring/">Open monitoring</a>
        </div>
        <div class="admin-panel-body admin-panel-body--flush">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr><th>Action</th><th>Actor</th><th>Severity</th><th>When</th></tr>
              </thead>
              <tbody id="dashAudit">
                <tr><td colspan="4" class="admin-muted">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <div class="admin-grid admin-grid-2 admin-mt">
      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">Newest videos</span>
          <a class="btn btn-ghost btn-sm" href="/Admin/videos/">Manage videos</a>
        </div>
        <div class="admin-panel-body admin-panel-body--flush">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr><th>Title</th><th>Channel</th><th>Published</th><th>Download</th><th></th></tr>
              </thead>
              <tbody id="recentVideosBody">
                <tr><td colspan="5" class="admin-muted">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="admin-panel">
        <div class="admin-panel-head">
          <span class="admin-panel-title">Runtime</span>
          <span class="admin-count" id="dashRuntimeAt">—</span>
        </div>
        <div class="admin-panel-body">
          <dl class="admin-dl" id="dashSystem">
            <dt>Status</dt><dd>Loading…</dd>
          </dl>
        </div>
      </section>
    </div>

    <section class="admin-panel admin-mt">
      <div class="admin-panel-head">
        <span class="admin-panel-title">Active administrator sessions</span>
        <span class="admin-count" id="dashSessionCount">—</span>
      </div>
      <div class="admin-panel-body admin-panel-body--flush">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Name</th><th>IP</th><th>Device</th><th>Started</th><th>Last seen</th><th>Expires</th><th></th></tr>
            </thead>
            <tbody id="dashSessions">
              <tr><td colspan="7" class="admin-muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </template>

  <script src="/view/d74.js"></script>
  <script src="/Admin/shell.js"></script>
  <script src="/Admin/admin_main.js"></script>
</body>

</html>
