<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D74 Edits | Admin login</title>
  <link rel="shortcut icon" type="image/x-icon" href="../../logo.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../view/app.css">
  <link rel="stylesheet" href="../admin.css">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body class="dark">
  <div class="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../../" aria-label="D74 Edits home">
        <span class="brand-mark"><img src="../../logo.png" alt="" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">D74 Edits</span>
          <span class="brand-sub">Admin login</span>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="icon-btn" data-theme-toggle aria-label="Toggle colour theme">
          <ion-icon name="sunny-outline" data-theme-icon></ion-icon>
        </button>
        <a class="btn btn-ghost btn-sm" href="../../explore/">Back to site</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card" style="width:min(460px,100%)">
      <section class="auth-main">
        <div class="auth-head">
          <span class="badge badge-accent" style="margin-bottom:14px">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
            Restricted area
          </span>
          <h2>Admin sign in</h2>
          <p>Use your administrator credentials to open the control room.</p>
        </div>

        <form class="form" id="adminForm" novalidate>
          <div class="form-error" id="formError" role="alert"></div>

          <div class="field">
            <label class="label" for="username">Username</label>
            <input class="input" type="text" id="username" name="username" placeholder="Administrator username"
              autocomplete="username" required>
          </div>

          <div class="field">
            <label class="label" for="password">Password</label>
            <div class="input-wrap">
              <input class="input" type="password" id="password" name="password" placeholder="Administrator password"
                autocomplete="current-password" required>
              <button class="input-toggle" type="button" data-password-toggle="password" aria-label="Show password">
                <ion-icon name="eye-outline"></ion-icon>
              </button>
            </div>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="submit">Sign in</button>
        </form>

        <div class="admin-login-note" style="margin-top:18px">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <span>Sessions are signed on the server and expire automatically. Credentials are never stored in the browser.</span>
        </div>
      </section>
    </div>
  </main>

  <script src="../../view/d74.js"></script>
  <script src="../../view/app.js"></script>
  <script src="../../view/ui.js"></script>
  <script src="../admin.js"></script>
</body>

</html>
