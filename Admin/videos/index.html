<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D74 Edits | Admin videos</title>
  <link rel="shortcut icon" type="image/x-icon" href="/logo.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/view/app.css">
  <link rel="stylesheet" href="/Admin/admin.css">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body class="dark admin-body" data-admin-page="videos" data-admin-title="Videos">
  <a class="admin-skip" href="#adminMain">Skip to content</a>
  <div id="adminRoot"></div>

  <template id="adminPage">
    <div class="admin-page-head">
      <div>
        <span class="admin-kicker">Library and channel</span>
        <h2>Videos</h2>
        <p>Browse the database library or the live YouTube uploads feed. Install clips, edit metadata and remove records.</p>
      </div>
      <div class="admin-head-actions">
        <a class="btn btn-ghost btn-sm" href="/Admin/init/">Installer</a>
        <button class="btn btn-primary btn-sm" type="button" id="videosSync">
          <ion-icon name="sync-outline" aria-hidden="true"></ion-icon> Sync channel
        </button>
      </div>
    </div>

    <div class="admin-panel">
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <div class="admin-tabs" role="group" aria-label="Video source">
            <button class="admin-tab is-active" type="button" data-view="library">Database library</button>
            <button class="admin-tab" type="button" data-view="channel">YouTube channel</button>
          </div>
          <span class="admin-count" id="videosCount">—</span>
        </div>
        <div class="admin-toolbar-group">
          <select class="admin-select" id="videosFilter" aria-label="Library filter" style="width:auto">
            <option value="all">All records</option>
            <option value="downloadable">Downloadable</option>
            <option value="page">Page link only</option>
          </select>
          <input class="admin-input admin-search" id="videosSearch" type="search"
            placeholder="Search title, channel or YouTube id" aria-label="Search videos">
          <button class="btn btn-ghost btn-sm" type="button" id="videosRefresh">Refresh</button>
        </div>
      </div>

      <div class="admin-video-grid" id="videoGrid" aria-live="polite"></div>
      <div id="videoState" hidden></div>

      <div class="admin-panel-foot admin-spread">
        <span class="admin-count" id="videoPageInfo">—</span>
        <div class="admin-actions">
          <button class="btn btn-ghost btn-sm" type="button" id="videoPrev" disabled>Previous</button>
          <button class="btn btn-ghost btn-sm" type="button" id="videoNext" disabled>Next</button>
        </div>
      </div>
    </div>

    <div class="admin-panel admin-mt">
      <div class="admin-panel-head">
        <span class="admin-panel-title">Sync status</span>
        <span class="admin-badge" id="videoSyncStatus">—</span>
      </div>
      <div class="admin-panel-body admin-stack" id="videoSyncChannels"></div>
    </div>
  </template>

  <script src="/view/d74.js"></script>
  <script src="/Admin/shell.js"></script>
  <script src="/Admin/videos/video.js"></script>
</body>

</html>
