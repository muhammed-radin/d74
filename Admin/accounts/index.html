<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D74 Edits | Admin accounts</title>
  <link rel="shortcut icon" type="image/x-icon" href="/logo.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/view/app.css">
  <link rel="stylesheet" href="/Admin/admin.css">

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>

<body class="dark admin-body" data-admin-page="accounts" data-admin-title="Accounts">
  <a class="admin-skip" href="#adminMain">Skip to content</a>
  <div id="adminRoot"></div>

  <template id="adminPage">
    <div class="admin-page-head">
      <div>
        <span class="admin-kicker">Members</span>
        <h2>Accounts</h2>
        <p>Registered members. Passwords are stored as salted scrypt hashes and never exposed by the API.</p>
      </div>
      <div class="admin-head-actions">
        <button class="btn btn-ghost btn-sm" type="button" id="accountsExport">Export JSON</button>
        <button class="btn btn-ghost btn-sm" type="button" id="accountsRefresh">
          <ion-icon name="refresh-outline" aria-hidden="true"></ion-icon> Refresh
        </button>
      </div>
    </div>

    <div class="admin-stats">
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="people-outline"></ion-icon> Total accounts</span>
        <div class="admin-stat-value" id="accTotal">—</div>
        <div class="admin-stat-meta">all registered members</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="calendar-outline"></ion-icon> Newest signup</span>
        <div class="admin-stat-value" id="accNewest" style="font-size:1.05rem">—</div>
        <div class="admin-stat-meta" id="accNewestMeta">—</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="phone-portrait-outline"></ion-icon> Platforms recorded</span>
        <div class="admin-stat-value" id="accPlatforms">—</div>
        <div class="admin-stat-meta">distinct values</div>
      </div>
      <div class="admin-stat">
        <span class="admin-stat-label"><ion-icon name="search-outline"></ion-icon> Showing</span>
        <div class="admin-stat-value" id="accShowing">—</div>
        <div class="admin-stat-meta">after search</div>
      </div>
    </div>

    <section class="admin-panel admin-mt">
      <div class="admin-toolbar">
        <div class="admin-toolbar-group">
          <input class="admin-input admin-search" id="accountsSearch" type="search"
            placeholder="Search name, email or id" aria-label="Search accounts">
        </div>
        <span class="admin-count" id="accountsCount">—</span>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Joined</th><th>Platform</th><th>Location</th><th>Details</th><th></th>
            </tr>
          </thead>
          <tbody id="accountsBody">
            <tr><td colspan="7" class="admin-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </template>

  <script src="/view/d74.js"></script>
  <script src="/Admin/shell.js"></script>
  <script src="/Admin/accounts/accounts.js"></script>
</body>

</html>
