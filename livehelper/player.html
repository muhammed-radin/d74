<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live channel · D74 Edits</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="shortcut icon" type="image/x-icon" href="../logo.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --text: #f2f5f7;
      --muted: #8a96a6;
      --accent: #d7ff3f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: stretch;
    }

    #player {
      width: 100%;
      height: 100vh;
      min-height: 220px;
    }

    .state {
      margin: auto;
      padding: 28px;
      max-width: 440px;
      text-align: center;
    }

    .state h1 {
      font-size: 1.1rem;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .state p {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.55;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2.4s;
      }
    }
  </style>
</head>

<body>
  <div id="player" aria-live="polite"></div>

  <script src="../view/d74.js"></script>
  <script>
    "use strict";

    (function () {
      var playerEl = document.getElementById("player");
      var id = new URLSearchParams(window.location.search).get("id") || "";

      function state(title, message, spinning) {
        playerEl.innerHTML =
          (spinning ? '<div class="spinner"></div>' : "") +
          '<div class="state"><h1></h1><p></p></div>';
        playerEl.querySelector("h1").textContent = title;
        playerEl.querySelector("p").textContent = message;
      }

      function fail(title, message) {
        state(title, message, false);
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.async = true;
          script.onload = resolve;
          script.onerror = function () {
            reject(new Error("script"));
          };
          document.head.appendChild(script);
        });
      }

      function buildSources(channel) {
        var list = channel && Array.isArray(channel.sources) ? channel.sources : [];
        if (!list.length && channel && channel.url) {
          list = [{ url: channel.url, keyId: channel.k1, key: channel.k2 }];
        }
        return list
          .map(function (item) {
            var file = String((item && item.url) || "").trim();
            if (!file) return null;
            var source = { file: file };
            if (item.keyId && item.key) {
              source.drm = {
                clearkey: {
                  keyId: String(item.keyId),
                  key: String(item.key),
                },
              };
            }
            return source;
          })
          .filter(Boolean);
      }

      async function boot() {
        if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
          return fail("No channel selected", "Open Live TV and pick a channel to start watching.");
        }

        state("Loading channel…", "Fetching the stream details.", true);

        var config = {};
        try {
          var configRes = await D74Api.request("/api/config");
          config = configRes.json() || {};
        } catch (_) {}

        var channel = null;
        try {
          var channelRes = await D74Api.request("/api/channels/" + encodeURIComponent(id));
          if (!channelRes.ok) throw new Error("not found");
          channel = channelRes.json();
        } catch (_) {
          return fail("Channel unavailable", "This channel could not be found. Pick another one from Live TV.");
        }

        if (!channel) {
          return fail("Channel unavailable", "This channel could not be found. Pick another one from Live TV.");
        }

        var sources = buildSources(channel);
        if (!sources.length) {
          return fail("Stream unavailable", "This channel has no stream configured right now.");
        }

        if (!config.jwplayerKey) {
          return fail(
            "Player not configured",
            "The video player key is missing on the server. Add JWPLAYER_KEY to .env and restart."
          );
        }

        try {
          await loadScript("https://ssl.p.jwpcdn.com/player/v/8.26.0/jwplayer.js");
        } catch (_) {
          return fail("Player failed to load", "Check your connection and refresh to try again.");
        }

        if (!window.jwplayer) {
          return fail("Player failed to load", "The video player could not start. Refresh to try again.");
        }

        window.jwplayer.key = config.jwplayerKey;

        function mountSource(index) {
          if (index >= sources.length) {
            return fail(
              "Stream unavailable",
              "None of this channel's sources could play. Try another channel."
            );
          }

          try {
            window.jwplayer("player").remove();
          } catch (_) {}
          playerEl.innerHTML = "";

          var player = window.jwplayer("player");
          var advanced = false;

          try {
            player.setup({
              playlist: [
                {
                  image: channel.logo || "",
                  title: channel.title || "",
                  sources: [sources[index]],
                },
              ],
              autostart: true,
              mute: true,
              width: "100%",
              height: "100%",
              stretching: "uniform",
              aspectratio: "16:9",
              cast: {},
              sharing: {},
              logo: { file: "", link: "", position: "control-bar" },
            });
          } catch (_) {
            return fail("Playback error", "The stream could not start. Try another channel.");
          }

          // JW Player can fail on a dead upstream. Walk the remaining
          // administrator-configured sources before giving up.
          player.on("error", function () {
            if (advanced) return;
            advanced = true;
            try {
              player.remove();
            } catch (_) {}
            mountSource(index + 1);
          });
        }

        mountSource(0);
      }

      boot();
    })();
  </script>
</body>

</html>
