<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live channel · D74 Edits</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <link rel="shortcut icon" type="image/x-icon" href="../logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video-js.min.css">

  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --text: #f2f5f7;
      --muted: #9aa6b5;
      --accent: #d7ff3f;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #player,
    .video-js {
      width: 100%;
      height: 100vh;
      background: #000;
      font-family: inherit;
    }

    .video-js .vjs-control-bar {
      background: linear-gradient(transparent, rgba(0, 0, 0, .88));
      min-height: 4.5em;
      padding: 1.25em .6em 0;
    }

    .video-js .vjs-play-progress,
    .video-js .vjs-volume-level {
      background: var(--accent);
    }

    .video-js .vjs-slider {
      background: rgba(255, 255, 255, .2);
    }

    .video-js .vjs-big-play-button {
      width: 2.8em;
      height: 2.8em;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: #10130b;
      line-height: 2.8em;
      box-shadow: 0 0 0 10px rgba(215, 255, 63, .12), 0 12px 30px rgba(0, 0, 0, .35);
    }

    .video-js:hover .vjs-big-play-button,
    .video-js .vjs-big-play-button:focus {
      background: #efffb3;
    }

    .state {
      margin: auto;
      padding: 40px 28px;
      max-width: 460px;
      text-align: center;
    }

    .state h1 { margin: 0 0 8px; font-size: 1.1rem; }
    .state p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.55; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>

<body>
  <div id="player" aria-live="polite"></div>

  <script src="../view/d74.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-dash@5.0.0/dist/videojs-contrib-dash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-eme@5.0.0/dist/videojs-contrib-eme.min.js"></script>
  <script>
    "use strict";

    (function () {
      var playerEl = document.getElementById("player");
      var id = new URLSearchParams(window.location.search).get("id") || "";
      var player = null;

      function state(title, message, spinning) {
        playerEl.innerHTML =
          (spinning ? '<div class="spinner"></div>' : "") +
          '<div class="state"><h1></h1><p></p></div>';
        playerEl.querySelector("h1").textContent = title;
        playerEl.querySelector("p").textContent = message;
      }

      function fail(title, message) {
        if (player) {
          player.dispose();
          player = null;
        }
        state(title, message, false);
      }

      function playbackUrl(url) {
        var value = String(url || "").trim();
        if (window.location.protocol === "https:" && /^http:\/\//i.test(value)) {
          return "https://" + value.slice(7);
        }
        return value;
      }

      function sourceTypes(url, declaredType) {
        var type = String(declaredType || "").trim().toLowerCase();
        var path = String(url || "").split(/[?#]/)[0].toLowerCase();
        if (type === "hls" || path.endsWith(".m3u8")) return ["application/x-mpegURL"];
        if (type === "dash" || path.endsWith(".mpd")) return ["application/dash+xml"];
        if (type === "mp4" || path.endsWith(".mp4") || path.endsWith(".m4v")) return ["video/mp4"];
        if (path.endsWith(".webm")) return ["video/webm"];
        // Auto/extensionless stream URLs are commonly HLS endpoints.
        return ["application/x-mpegURL", "video/mp4"];
      }

      function base64UrlFromHex(value) {
        var bytes = String(value || "").match(/.{1,2}/g) || [];
        var binary = bytes.map(function (item) {
          return String.fromCharCode(parseInt(item, 16));
        }).join("");
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }

      function clearKeySystem(source) {
        if (!source.keyId || !source.key) return null;
        return {
          "org.w3.clearkey": {
            getLicense: function (_, __, callback) {
              var license = JSON.stringify({
                keys: [{
                  kty: "oct",
                  kid: base64UrlFromHex(source.keyId),
                  k: base64UrlFromHex(source.key)
                }],
                type: "temporary"
              });
              callback(null, new TextEncoder().encode(license));
            }
          }
        };
      }

      function buildSources(channel) {
        var list = channel && Array.isArray(channel.sources) ? channel.sources : [];
        return list.map(function (item) {
          var url = playbackUrl(item && item.url);
          if (!url) return null;
          var keyId = item && item.keyId;
          var key = item && item.key;
          return sourceTypes(url, item && item.type).map(function (type) {
            var source = { src: url, type: type, keyId: keyId, key: key };
            source.keySystems = clearKeySystem(source);
            return source;
          });
        }).filter(Boolean).flat();
      }

      function mountSource(sources, index, channel) {
        if (index >= sources.length) {
          return fail(
            "Stream format unsupported",
            "None of this channel's sources could play in this browser. Try another channel."
          );
        }

        var source = sources[index];
        playerEl.innerHTML =
          '<video id="videojs-player" class="video-js vjs-big-play-centered" controls ' +
          'playsinline preload="auto" poster=""></video>';
        var videoEl = document.getElementById("videojs-player");
        videoEl.poster = channel.logo || "";
        player = videojs(videoEl, {
          autoplay: true,
          muted: true,
          responsive: true,
          fluid: true,
          liveui: true,
          html5: {
            vhs: { overrideNative: true }
          },
          inactivityTimeout: 2500,
          playbackRates: [0.5, 1, 1.5, 2],
          controlBar: {
            pictureInPictureToggle: true,
            volumePanel: { inline: false }
          }
        });

        if (source.keySystems && typeof player.eme === "function") {
          player.eme();
        }
        player.src(source);

        var advanced = false;
        player.on("error", function () {
          if (advanced) return;
          advanced = true;
          player.dispose();
          player = null;
          mountSource(sources, index + 1, channel);
        });
      }

      async function boot() {
        if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) {
          return fail("No channel selected", "Open Live TV and pick a channel to start watching.");
        }

        state("Loading channel…", "Fetching the stream details.", true);
        var channel = null;
        try {
          var response = await D74Api.request("/api/channels/" + encodeURIComponent(id));
          if (!response.ok) throw new Error("not found");
          channel = response.json();
        } catch (_) {
          return fail("Channel unavailable", "This channel could not be found. Pick another one from Live TV.");
        }

        if (!channel) return fail("Channel unavailable", "This channel could not be found.");
        var sources = buildSources(channel);
        if (!sources.length) return fail("Stream unavailable", "This channel has no stream configured right now.");
        if (typeof videojs !== "function") {
          return fail("Player failed to load", "The video player could not start. Refresh to try again.");
        }
        mountSource(sources, 0, channel);
      }

      boot();
    })();
  </script>
</body>

</html>
